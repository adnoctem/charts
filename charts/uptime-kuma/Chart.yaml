  # ref: https://artifacthub.io/docs/topics/annotations/helm/
  artifacthub.io/changes: |
    - kind: changed
      description: "bumped appVersion from 1.23.13 to 2.5.3 (v1 -> v2 major upgrade, see the chart's Upgrading notes)"
    - kind: fixed
      description: the readinessProbe and startupProbe blocks both incorrectly rendered as a second/third livenessProbe, so only one of the three ever actually applied to the container
    - kind: fixed
      description: all three probes checked a `/alive` path that has never existed in Uptime Kuma's HTTP server (v1 or v2) - switched to `/`, matching the redirect the bundled Docker healthcheck itself checks for
    - kind: fixed
      description: correct the ConfigMap key rendered for `uptimeKuma.node.tlsRejectUnauthorized` from `NODE_EXTRA_CA_CERTS` (a duplicate of the unrelated CA-bundle setting) to `NODE_TLS_REJECT_UNAUTHORIZED`
