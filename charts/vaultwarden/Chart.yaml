  # ref: https://artifacthub.io/docs/topics/annotations/helm/
  artifacthub.io/changes: |
    - kind: fixed
      description: corrected the license annotation (Vaultwarden is AGPL-3.0, not MIT)
    - kind: changed
      description: "bumped appVersion from 1.30.5 to 1.37.2"
    - kind: changed
      description: renamed WEBSOCKET_ENABLED to ENABLE_WEBSOCKET; the separate WebSocket port was removed upstream in 1.31.0 and traffic is now served on the main port, so vaultwarden.websocket.port is deprecated and no longer rendered
    - kind: fixed
      description: removed a broken Ingress rule that routed /notifications/hub to a Service port that was never actually defined
    - kind: added
      description: added SSO (OpenID Connect) login support via the new vaultwarden.sso values block
