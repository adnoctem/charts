linkstack:
  serverAdmin: info@adnoctem.co
  serverName: linkstack.charts.internal
  logLevel: warn
  timeZone: Europe/Berlin
  phpMemoryLimit: 512M
  uploadMaxFileSize: 32M

ingress:
  enabled: true
  className: traefik
  backendProtocol: https
  annotations:
    cert-manager.io/cluster-issuer: development-issuer
  tls:
    - secretName: linkstack-ingress-tls
      hosts:
        - linkstack.charts.internal

service:
  annotations:
    traefik.ingress.kubernetes.io/service.serverstransport: linkstack-backend@file

livenessProbe:
  enabled: true

readinessProbe:
  enabled: true

startupProbe:
  enabled: true
