name: 'Testing'

on:
  workflow_dispatch:
    inputs:
      forceTest:
        default: true
        description: Force the running of tests
        required: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - charts/**
  pull_request:
    branches:
      - main
    paths:
      - charts/**

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Determine if charts have changed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check_change.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Chart-Testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Check changes
        id: check_change
        run: |
          changed=$(ct list-changed --config config/ct-config.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint Helm Charts
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.15.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up Chart-Testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (lint)
        if: ${{ needs.changes.outputs.changed == 'true' || github.event.inputs.forceTest }}
        run: |
          ct lint --config config/ct-config.yaml

  lint-artifacthub:
    name: Lint Helm Charts with ArtifactHub Linter
    needs: [changes]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: sh
    container:
      image: public.ecr.aws/artifacthub/ah:v1.14.0
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run ah lint
        working-directory: charts
        run: ah lint

  test:
    name: Test Helm Charts
    needs: [changes, lint, lint-artifacthub]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.15.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up Chart-Testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (lint)
        if: ${{ needs.changes.outputs.changed == 'true' || github.event.inputs.forceTest }}
        run: ct lint --config config/ct-config.yaml

      - name: Run kind to create a Kubernetes cluster
        if: ${{ needs.changes.outputs.changed == 'true' || github.event.inputs.forceTest }}
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          config: config/k8s/cluster/kind-config.yaml

      - name: Run chart-testing (install)
        if: ${{ needs.changes.outputs.changed == 'true' || github.event.inputs.forceTest }}
        run: |
          ct install --config config/ct-config.yaml
