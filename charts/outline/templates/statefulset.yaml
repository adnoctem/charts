{{- if eq .Values.kind "StatefulSet" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "outline.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "outline.labels" . | nindent 4 }}
spec:
  {{- include "outline.podSpec" . | nindent 2 }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .Values.outline.data.pvc.reclaimPolicy }}
    whenScaled: {{ .Values.outline.data.pvc.reclaimPolicy }}
{{- end }}
