{{- /*
  Keys secret (SECRET_KEY, UTILS_SECRET)
*/}}
{{- if or (not .Values.outline.secretKey.existingSecret.name) (not .Values.outline.utilsSecret.existingSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "outline.secrets.keys" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: outline
    {{- include "outline.labels" . | nindent 4 }}
    {{- if .Values.secret.labels }}
    {{- toYaml .Values.secret.labels | nindent 4 }}
    {{- end }}
  {{- if .Values.secret.annotations }}
  annotations:
    {{- toYaml .Values.secret.annotations | nindent 4 -}}
  {{- end }}
type: Opaque
data:
  {{- if not .Values.outline.secretKey.existingSecret.name }}
  SECRET_KEY: {{ default (randAlphaNum 32) .Values.outline.secretKey.value | b64enc | quote }}
  {{- end }}
  {{- if not .Values.outline.utilsSecret.existingSecret.name }}
  UTILS_SECRET: {{ default (randAlphaNum 32) .Values.outline.utilsSecret.value | b64enc | quote }}
  {{- end }}
{{- end }}
---
{{- /*
  Database secret (DATABASE_URL)
*/}}
{{- if not .Values.outline.database.existingSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "outline.secrets.database" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: outline
    {{- include "outline.labels" . | nindent 4 }}
    {{- if .Values.secret.labels }}
    {{- toYaml .Values.secret.labels | nindent 4 }}
    {{- end }}
  {{- if .Values.secret.annotations }}
  annotations:
    {{- toYaml .Values.secret.annotations | nindent 4 -}}
  {{- end }}
type: Opaque
data:
  DATABASE_URL: {{ include "outline.database.uri" . | b64enc | quote }}
{{- end }}
