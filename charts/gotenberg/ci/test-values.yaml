gotenberg:
  api:
    downloadFromMaxConcurrency: 3
    downloadFromMaxEntries: 20
  pdf:
    maxConcurrency: 2

ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: development-issuer
  hosts:
    - host: gotenberg.charts.internal
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: gotenberg-ingress-tls
      hosts:
        - gotenberg.charts.internal

livenessProbe:
  enabled: true

readinessProbe:
  enabled: true

startupProbe:
  enabled: true

autoscaling:
  enabled: true
