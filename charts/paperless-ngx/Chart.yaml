apiVersion: v2
appVersion: 3.1.3
kubeVersion: ">=1.26.0-0"
name: paperless-ngx
version: 0.4.1
dependencies:
  - name: postgresql
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
    version: ~15.5
  - name: redis
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
    version: ~19.5
  - name: tika
    repository: https://apache.jfrog.io/artifactory/tika
    condition: tika.enabled
    version: ~2.9
  - name: gotenberg
    repository: oci://ghcr.io/adnoctem/charts
    condition: gotenberg.enabled
    version: ~0.4.0
description: Paperless-NGX is a community-supported supercharged version of paperless - scan, index and archive all your physical documents
home: https://github.com/paperless-ngx/paperless-ngx
icon: https://raw.githubusercontent.com/adnoctem/artwork/425046029eaed451f5ced22ddc650059dff11878/projects/paperless-ngx/icon/color/paperless-ngx-icon-color.png
keywords:
  - documents
  - archival
  - ocr
  - conversion
  - paper
  - paperless
sources:
  - "https://github.com/adnoctem/charts"
maintainers:
  - name: adnoctem
    email: info@adnoctem.co
  - name: MVProwess
    email: info@mvprowess.com
annotations:
  artifacthub.io/category: storage
  artifacthub.io/license: GPL-3.0
  artifacthub.io/signKey: |
    fingerprint: 97DB36A8BD5E342076ED46D63E317D513290CC4B
    url: https://keys.openpgp.org/vks/v1/by-fingerprint/97DB36A8BD5E342076ED46D63E317D513290CC4B
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: paperless-ngx
      image: ghcr.io/paperless-ngx/paperless-ngx:3.1.3
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/adnoctem/charts
    - name: Support
      url: https://github.com/adnoctem/charts/issues
    - name: Paperless-NGX GitHub Repository
      url: https://github.com/paperless-ngx/paperless-ngx
    - name: Paperless-NGX Documentation
      url: https://docs.paperless-ngx.com/
  org.opencontainers.image.vendor: "Ad Noctem Collective"
  org.opencontainers.image.licenses: "GPL-3.0"
  # ref: https://artifacthub.io/docs/topics/annotations/helm/
  artifacthub.io/changes: |
    - kind: changed
      description: repository owner changed from fmjstudios to adnoctem
    - kind: fixed
      description: verify rotation of expired GPG key
    - kind: fixed
      description: corrected the license annotation (Paperless-ngx is GPL-3.0, not MIT) and a stale image tag annotation (2.4.0, though appVersion was already 2.10.1)
    - kind: changed
      description: bump appVersion to 3.1.3 (from 2.10.1), a major version upgrade - see README Upgrading section, upgrading in-place requires passing through 2.20.15 first
    - kind: fixed
      description: the generated Paperless secret key rotated on every helm upgrade, invalidating all active sessions - it's now preserved across upgrades
    - kind: fixed
      description: point the gotenberg subchart dependency at its current ghcr.io/adnoctem/charts location, replacing the stale pre-rename path
    - kind: added
      description: extraEnvVars for the many Paperless-ngx settings without a dedicated value (PAPERLESS_TRUSTED_PROXIES, PAPERLESS_DB_OPTIONS, consumer polling/stability settings, etc.)
    - kind: fixed
      description: the icon annotation pointed at a GitHub `blob` URL, which serves an HTML page rather than the raw image - ArtifactHub failed to fetch it as a logo. Switched to raw.githubusercontent.com
