apiVersion: v2
appVersion: 0.90.2
kubeVersion: ">=1.26.0-0"
name: activepieces
version: 0.4.1
dependencies:
  - name: postgresql
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
    version: ~15.5
  - name: redis
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
    version: ~19.5
description: Activepieces is an open source all-in-one automation tool with 100+ integrations
home: https://www.activepieces.com/
icon: https://raw.githubusercontent.com/adnoctem/artwork/425046029eaed451f5ced22ddc650059dff11878/projects/activepieces/icon/color/activepieces-icon-color.png
keywords:
  - automation
  - workflow
  - activepieces
  - zapier
  - n8n
sources:
  - "https://github.com/adnoctem/charts"
maintainers:
  - name: adnoctem
    email: info@adnoctem.co
  - name: MVProwess
    email: info@mvprowess.com
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: MIT
  artifacthub.io/signKey: |
    fingerprint: 97DB36A8BD5E342076ED46D63E317D513290CC4B
    url: https://keys.openpgp.org/vks/v1/by-fingerprint/97DB36A8BD5E342076ED46D63E317D513290CC4B
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: activepieces
      image: docker.io/activepieces/activepieces:0.90.2
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/adnoctem/charts
    - name: Support
      url: https://github.com/adnoctem/charts/issues
    - name: Activepieces Homepage
      url: https://www.activepieces.com/
    - name: Activepieces Documentation
      url: https://www.activepieces.com/docs/getting-started/introduction
  org.opencontainers.image.vendor: "Ad Noctem Collective"
  org.opencontainers.image.licenses: "MIT"
  # ref: https://artifacthub.io/docs/topics/annotations/helm/
  artifacthub.io/changes: |
    - kind: changed
      description: repository owner changed from fmjstudios to adnoctem
    - kind: fixed
      description: verify rotation of expired GPG key
    - kind: changed
      description: bump appVersion to 0.90.2 (from 0.28.0), a large multi-year range - see README Upgrading section
    - kind: fixed
      description: every install was sending three removed/renamed environment variables unconditionally (AP_QUEUE_MODE, AP_FLOW_WORKER_CONCURRENCY, AP_PIECES_SOURCE) plus a dead template-source URL and Copilot Azure OpenAI settings for a feature deprecated upstream since 0.71.0 - renamed or removed as appropriate
    - kind: fixed
      description: the queue UI enablement check compared the queue mode against the wrong case ("REDIS" instead of "redis"), so it could never actually enable regardless of configuration
    - kind: added
      description: extraEnvVars for the many Activepieces settings without a dedicated value (AP_SSRF_ALLOW_LIST, AP_ALLOWED_EMBED_ORIGINS, AP_PREWARM_CACHE_ON_STARTUP, AP_SMTP_* for outgoing email, etc.)
    - kind: fixed
      description: the icon annotation pointed at a GitHub `blob` URL, which serves an HTML page rather than the raw image - ArtifactHub failed to fetch it as a logo. Switched to raw.githubusercontent.com
