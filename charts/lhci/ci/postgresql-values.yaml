# PostgreSQL StatefulSet with verified database TLS and Secret-backed basic auth.
image:
  pullPolicy: IfNotPresent
fullnameOverride: lhci-postgresql-ci
kind: StatefulSet
replicaCount: 1
strategy:
  type: RollingUpdate
  rollingUpdate:
    partition: 0

lhci:
  port: 9103
  host: 0.0.0.0
  logLevel: verbose
  storage:
    sqlDialect: postgres
    sqlConnectionSsl: true
    sqlDangerouslyResetDatabase: false
    sqlMigrationOptions:
      tableName: LHCIMigrations
    sqlDialectOptions:
      application_name: lhci-ci
    sequelizeOptions:
      pool:
        max: 3
        min: 0
        idle: 10000
    tls:
      # Generated by the enabled PostgreSQL subchart in this same installation.
      existingSecret: lhci-postgresql-db-crt
      caKey: ca.crt
      rejectUnauthorized: true
  basicAuth:
    enabled: true
    # CI only: reuse the subchart's service-binding credentials to test existing Secrets.
    existingSecret:
      name: lhci-postgresql-db-svcbind-custom-user
      usernameKey: username
      passwordKey: password
  dbWait:
    retries: 90
    timeout: 3
  deleteOldBuildsCron:
    - schedule: "0 2 * * 0"
      maxAgeInDays: 14
      onlyBranches:
        - ci

persistence:
  enabled: false

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: development-issuer
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: postgresql.lhci.charts.internal
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: lhci-postgresql-ingress-tls
      hosts:
        - postgresql.lhci.charts.internal

service:
  type: ClusterIP
  ports:
    http: 8080
  annotations:
    adnoctem.co/purpose: lhci-ci
  labels:
    adnoctem.co/fixture: postgresql
  sessionAffinity: None
  ipFamilyPolicy: SingleStack
serviceAccount:
  create: false
  name: default
  automount: false
podLabels:
  adnoctem.co/fixture: postgresql
nodeSelector:
  kubernetes.io/os: linux
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    memory: 512Mi
livenessProbe:
  enabled: true
  timeoutSeconds: 2
readinessProbe:
  enabled: true
  timeoutSeconds: 2
startupProbe:
  enabled: true
  periodSeconds: 5
  failureThreshold: 120
podDisruptionBudget:
  enabled: true
  minAvailable: null
  maxUnavailable: "100%"

mysql:
  enabled: false
postgresql:
  enabled: true
  fullnameOverride: lhci-postgresql-db
  architecture: standalone
  # CI only: archived image matching the dependency; see docs/CONTRIBUTING.md.
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 16.4.0-debian-12-r14
  auth:
    postgresPassword: ci-postgres-password
    username: lhci_ci
    database: lhci_ci
    password: "ci:p@ss/word?#%"
  tls:
    enabled: true
    autoGenerated: true
  serviceBindings:
    enabled: true
  # TLS uses the dependency's certificate-copy init container, even with permissions disabled.
  volumePermissions:
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell
      tag: 12-debian-12-r30
  primary:
    service:
      ports:
        postgresql: 55432
    persistence:
      enabled: true
      storageClass: standard
      accessModes:
        - ReadWriteOnce
      size: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
