apiVersion: v2
appVersion: 1.0.1
kubeVersion: ">=1.26.0-0"
name: lhci
version: 0.1.0
dependencies:
  - name: postgresql
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
    version: ~15.5
  - name: mysql
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: mysql.enabled
    version: ~11.1
description: A Lighthouse CI server for storing, reviewing and comparing Lighthouse reports.
home: https://github.com/adnoctem/lhci
icon: https://raw.githubusercontent.com/GoogleChrome/lighthouse/main/assets/lighthouse-logo_512px.png
keywords:
  - lighthouse
  - performance
  - ci
sources:
  - "https://github.com/adnoctem/charts"
  - "https://github.com/adnoctem/lhci"
maintainers:
  - name: adnoctem
    email: info@adnoctem.co
  - name: MVProwess
    email: info@mvprowess.com
annotations:
  # see: https://artifacthub.io/docs/topics/annotations/helm/
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: MIT
  artifacthub.io/signKey: |
    fingerprint: 97DB36A8BD5E342076ED46D63E317D513290CC4B
    url: https://keys.openpgp.org/vks/v1/by-fingerprint/97DB36A8BD5E342076ED46D63E317D513290CC4B
  artifacthub.io/prerelease: "true"
  artifacthub.io/images: |
    - name: lhci
      image: ghcr.io/adnoctem/lhci:1.0.1
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/adnoctem/charts
    - name: Support
      url: https://github.com/adnoctem/charts/issues
    - name: Lighthouse CI GitHub Repository
      url: https://github.com/adnoctem/lhci
    - name: Lighthouse CI Documentation
      url: https://github.com/GoogleChrome/lighthouse-ci/blob/v0.15.1/docs/configuration.md
  org.opencontainers.image.vendor: "Ad Noctem Collective"
  org.opencontainers.image.licenses: "MIT"
  artifacthub.io/changes: |
    - kind: added
      description: initial chart release with SQLite, PostgreSQL and MySQL storage
