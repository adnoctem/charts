apiVersion: v2
appVersion: 2.16.2
kubeVersion: ">=1.26.0-0"
name: linkwarden
version: 0.5.0
dependencies:
  - name: postgresql
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
    version: ~15.5
description: Linkwarden is an open-source collaborative bookmark manager to collect, organize and preserve webpages
home: https://linkwarden.app/
icon: https://raw.githubusercontent.com/linkwarden/linkwarden/4640c1c966d37b7fc22e4ebfcb244d03da1d6d82/assets/logo.png
keywords:
  - bookmarks
  - archival
  - collaboration
  - linkding
  - linkace
  - archivebox
sources:
  - "https://github.com/adnoctem/charts"
maintainers:
  - name: adnoctem
    email: info@adnoctem.co
  - name: MVProwess
    email: info@mvprowess.com
annotations:
  artifacthub.io/category: storage
  artifacthub.io/license: AGPL-3.0
  artifacthub.io/signKey: |
    fingerprint: 97DB36A8BD5E342076ED46D63E317D513290CC4B
    url: https://keys.openpgp.org/vks/v1/by-fingerprint/97DB36A8BD5E342076ED46D63E317D513290CC4B
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: linkwarden
      image: ghcr.io/linkwarden/linkwarden:v2.16.2
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/adnoctem/charts
    - name: Support
      url: https://github.com/adnoctem/charts/issues
    - name: Linkwarden Homepage
      url: https://linkwarden.app/
    - name: Linkwarden Documentation
      url: https://docs.linkwarden.app/
  org.opencontainers.image.vendor: "Ad Noctem Collective"
  org.opencontainers.image.licenses: "AGPL-3.0"
  # ref: https://artifacthub.io/docs/topics/annotations/helm/
  artifacthub.io/changes: |
    - kind: changed
      description: repository owner changed from fmjstudios to adnoctem
    - kind: fixed
      description: verify rotation of expired GPG key
    - kind: fixed
      description: corrected the artifacthub.io/license annotation - Linkwarden is AGPL-3.0, not MIT
    - kind: changed
      description: bump appVersion to 2.16.2 (from 2.5.3) - fixes CVE-2026-42455 (stored XSS via archive upload, affects <=2.14.0); see README Upgrading section for a required manual migration step
    - kind: fixed
      description: bungie and fusionauth SSO providers never actually received their required apiKey/tenantId - the secret was created but never wired to the container
    - kind: added
      description: support the authelia, azure_ad, azure_ad_b2c, synology, and generic oidc SSO providers added upstream since 2.13.0/2.15.0/2.16.1
    - kind: added
      description: extraEnvVars lets any of Linkwarden's many other environment variables (AI tagging providers, memory tuning, user-content-domain isolation) be set without a dedicated value
