type: Opaque
data:
  REDIS_URL: {{ include "outline.redis.uri" . | b64enc | quote }}
  {{- if .Values.outline.redis.collaborationUrl }}
  REDIS_COLLABORATION_URL: {{ .Values.outline.redis.collaborationUrl | b64enc | quote }}
  {{- end }}
{{- end }}
---
{{- /*
  SSL key secret (SSL_KEY) - not recommended when terminating TLS at the Ingress, which is this chart's default
  TODO: no existingSecret option yet - see docs/TODO.md
*/}}
{{- if .Values.outline.ssl.key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-ssl" (include "outline.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: outline
    {{- include "outline.labels" . | nindent 4 }}
    {{- if .Values.secret.labels }}
    {{- toYaml .Values.secret.labels | nindent 4 }}
    {{- end }}
  {{- if .Values.secret.annotations }}
  annotations:
    {{- toYaml .Values.secret.annotations | nindent 4 -}}
  {{- end }}
type: Opaque
data:
  SSL_KEY: {{ .Values.outline.ssl.key | b64enc | quote }}
{{- end }}
