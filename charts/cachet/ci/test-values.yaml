cachet:
  url: "cachet.charts.internal"
  env: production
  debug: false
  emoji: false
  beacon: false

  drivers:
    cache: database
    session: database
    queue: database
    mail: smtp

  key:
    value: ""
    existingSecret:
      name: ""
      key: ""

  database:
    driver: pgsql
    port: "5432"
    name: cachet
    user: cachet
    password: cachet
    existingSecret: ""

  redis:
    host: ""
    port: "6379"
    database: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: development-issuer
  tls:
    - secretName: cachet-ingress-tls
      hosts:
        - "cachet.charts.internal"

livenessProbe:
  enabled: true

readinessProbe:
  enabled: true

startupProbe:
  enabled: true

postgresql:
  enabled: true
  auth:
    username: "cachet"
    password: "cachet"
    database: "cachet"
