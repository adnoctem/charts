name: 'Testing'

on:
  workflow_dispatch:
    inputs:
      forceTest:
        default: true
        description: Force the running of tests
        required: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - charts/**
  pull_request:
    branches:
      - main
    paths:
      - charts/**

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: '${{ github.workflow }}@${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  # Safe to cancel: unlike release.yaml, nothing here signs or publishes
  # anything, so a superseded run can be dropped without leaving state behind.
  cancel-in-progress: true

jobs:
  quality:
    name: Verify code quality a final time with 'pre-commit'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files

  changes:
    name: Determine if charts have changed
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
      packages: read
    outputs:
      changed: ${{ steps.check_change.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Chart-Testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Check changes
        id: check_change
        run: |
          changed=$(ct list-changed --config config/ct-config.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint Helm Charts
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up Chart-Testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (lint)
        if: ${{ needs.changes.outputs.changed == 'true' || github.event.inputs.forceTest }}
        run: |
          ct lint --config config/ct-config.yaml

  lint-artifacthub:
    name: Lint Helm Charts with ArtifactHub Linter
    needs: [changes]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: sh
    container:
      image: public.ecr.aws/artifacthub/ah:v1.23.0
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run ah lint
        working-directory: charts
        run: ah lint

  test:
    name: Test Helm Charts
    needs: [changes, lint, lint-artifacthub]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up Chart-Testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (lint)
        if: ${{ needs.changes.outputs.changed == 'true' || github.event.inputs.forceTest }}
        run: ct lint --config config/ct-config.yaml

      - name: Run kind to create a Kubernetes cluster
        if: ${{ needs.changes.outputs.changed == 'true' || github.event.inputs.forceTest }}
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          config: config/k8s/cluster/kind-config.yaml

      - name: Run chart-testing (install)
        if: ${{ needs.changes.outputs.changed == 'true' || github.event.inputs.forceTest }}
        run: |
          ct install --config config/ct-config.yaml

  dispatch:
    name: Dispatch a release workflow run
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write
    steps:
      - name: Dispatch a release workflow run
        if: ${{ github.event_name == 'push' && always() && !contains(join(needs.*.result, ','), 'failure') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const payload = {
              run_id: "${{ github.run_id }}",
              sha: "${{ github.sha }}"
            }

            console.log("Sending event payload", JSON.stringify(payload, null, 2));

            const { owner, repo } = context.repo;
            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: 'release',
              client_payload: payload
            });
