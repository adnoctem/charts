paperless:
  domain: paperless.charts.internal
  secretKey:
    value: "PretendThisIsASecretKey"

  classifierMatchThreshold: 0.5
  matchRegexTimeoutSeconds: 0.25

  data:
    paths:
      scratchDir: /tmp/paperless-ci

  consume:
    barcodes:
      storeValues: true

  ai:
    extraParams:
      temperature: 0.2
    embeddingApiKey:
      value: "ci-placeholder-embedding-key"

  auth:
    autoLoginUsername: ""
    adminUser: "admin"
    adminPassword: "admin-pass"

  redis:
    password: "paperless"

  postgresql:
    port: 5432
    name: "paperless"
    user: "paperless"
    password: "paperless"

  tika:
    enabled: true
    endpoint: ""

  gotenberg:
    endpoint: ""

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: development-issuer
  tls:
    - secretName: domain-tld-tls
      hosts:
        - paperless.charts.internal
  extraHosts:
    - host: paperless.charts.internal
      paths:
        - path: /
          pathType: ImplementationSpecific

livenessProbe:
  enabled: true

readinessProbe:
  enabled: true

startupProbe:
  enabled: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

postgresql:
  enabled: true
  image:
    repository: bitnamilegacy/postgresql
    tag: 16.4.0-debian-12-r14
  auth:
    enablePostgresUser: true
    postgresPassword: "postgres"
    username: "paperless"
    password: "paperless"
    database: "paperless"
    usePasswordFiles: false

  primary:
    name: primary
    persistence:
      enabled: true
      storageClass: "standard"
      accessModes:
        - ReadWriteOnce
      size: 5Gi

redis:
  enabled: true
  image:
    repository: bitnamilegacy/redis
    tag: 7.2.5-debian-12-r0
  architecture: standalone
  auth:
    password: "paperless"

tika:
  enabled: true

gotenberg:
  enabled: true
  gotenberg:
    chromium:
      disableJavaScript: true
      allowList: "file:///tmp/.*"

    logging:
      level: warn
