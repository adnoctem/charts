ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: development-issuer
  hosts:
    - host: uptime-kuma.charts.internal
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: uptime-kuma-ingress-tls
      hosts:
        - uptime-kuma.charts.internal

livenessProbe:
  enabled: true

readinessProbe:
  enabled: true

startupProbe:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1
